<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernplattform · PVAP1</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111b2b'/%3E%3Cpath d='M7 7h7v19H7zm11 0h7v19h-7z' fill='%2346d7ff'/%3E%3C/svg%3E"><link rel="stylesheet" href="platform.css?v=host-feedback-1"><script defer src="crm.js?v=host-feedback-1"></script><script defer src="rich-tasks.js?v=host-feedback-1"></script><script defer src="audio-practice.js?v=host-feedback-1"></script><script defer src="practice.js?v=host-feedback-1"></script><script defer src="presentations.js?v=host-feedback-1"></script><script defer src="discussion.js?v=host-feedback-1"></script><script defer src="feedback.js?v=host-feedback-1"></script><script defer src="host-feedback.js?v=host-feedback-1"></script><script defer src="platform.js?v=host-feedback-1"></script></head><body><header><div id="header-start"><strong>Lernplattform</strong></div><button id="learner-practice" data-practice-select hidden>visuell üben</button><button id="learner-auditory" class="secondary" data-practice-auditory hidden>auditiv üben</button><button id="learner-infographics" data-practice-infographics class="secondary" hidden>Infographiken</button><button id="learner-discussion" class="secondary" hidden disabled>Diskussion<span class="notification-dot" aria-hidden="true"></span></button><button id="learner-feedback" class="secondary" aria-controls="feedback-section" aria-expanded="false" hidden>Alpha Tester Feedback geben</button><button id="presentation-tree-toggle" aria-controls="sidebar" hidden>Themen aufklappen</button><button id="presentation-invite" hidden>Zur Präsentation einladen</button><div id="host-feedback-menu" hidden><button id="host-feedback-button" class="secondary" aria-expanded="false" aria-controls="host-feedback-list">Feedback <span id="host-feedback-count"></span></button><div id="host-feedback-list" hidden aria-label="Feedbackmeldungen"></div></div><span id="identity"></span><button id="learner-menu" data-view="privacy" hidden>Mein Menü</button><button id="logout" hidden>Abmelden</button></header><p id="message" role="status" hidden></p><div id="workspace"><div id="root"></div><section id="feedback-section" aria-labelledby="feedback-title" hidden>

</form></section><section id="host-feedback-section" aria-label="Eingegangenes Feedback" hidden></section></div></body></html>
