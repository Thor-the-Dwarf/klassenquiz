<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klassenquiz · AP1 Klassenquiz</title><style>
:root{color-scheme:dark;--bg:#10101d;--panel:#1a1a2d;--line:#343449;--text:#f8f7ff;--muted:#adadc5;--lime:#d4ff62;--purple:#9478ff;font:16px/1.5 system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:var(--lime);color:#172004;padding:13px 20px;font-weight:750;transition:transform .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:default;transform:none}button.secondary{background:#303047;color:var(--text)}button.outline{background:transparent;border:1px solid var(--line);color:var(--text)}a{color:var(--lime)}input,select{width:100%;background:#111120;color:white;border:1px solid #55556d;border-radius:10px;padding:12px;margin-top:7px}input:focus,select:focus,button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}label{font-size:.9rem;font-weight:650}h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,4vw,3.4rem);line-height:1.12;letter-spacing:-.045em}h2{font-size:1.6rem;letter-spacing:-.025em}h3{font-size:1.05rem}.muted{color:var(--muted)}.eyebrow{font-size:.78rem;font-weight:750;letter-spacing:.15em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}.wrap{max-width:1440px;margin:auto;padding:0 40px 40px}header{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}.brand{font-size:1.4rem;font-weight:850;letter-spacing:-.04em}.brand span{color:var(--lime)}.badge{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:30px;padding:6px 13px;font-size:.82rem;color:#dcdbea}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.top p{margin-top:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}.filters{display:grid;grid-template-columns:1fr 190px;gap:14px;margin:22px 0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.exercise{display:block;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:22px;min-height:166px;position:relative}.exercise.selected{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}.exercise h3{font-size:1.13rem;line-height:1.3;margin:17px 0 10px}.exercise .meta{font-size:.83rem;font-weight:450;color:var(--muted)}.pill{display:inline-block;border-radius:6px;padding:3px 8px;background:#35304f;color:#ded4ff;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}.exercise .arrow{position:absolute;right:18px;top:18px;color:var(--lime)}.sidebar{align-self:start;position:sticky;top:24px}.roomcode{font-size:3rem;letter-spacing:.13em;font-weight:850;color:var(--lime);margin:10px 0}.stack{display:grid;gap:13px}.divider{border:0;border-top:1px solid var(--line);margin:23px 0}.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.person{background:#303047;border-radius:8px;padding:7px 11px;font-size:.86rem}.person.done{border:1px solid var(--lime)}.notice{background:#342744;border:1px solid #72518c;border-radius:12px;padding:12px 17px;margin-bottom:20px}.notice[hidden]{display:none}.linkfield{font-size:.8rem}.large{width:100%;padding:17px}.hint{font-size:.85rem;color:var(--muted)}.footer{margin-top:22px;color:var(--muted);font-size:.82rem}details{margin-top:16px}summary{cursor:pointer;color:var(--muted);font-size:.85rem}.join{max-width:480px;margin:70px auto}.join h1{margin:15px 0 28px}.join form{display:grid;gap:20px}.waiting{text-align:center;padding:65px 24px}.waiting .symbol{width:76px;height:76px;border-radius:22px;background:var(--lime);color:#172004;font-size:2.5rem;margin:0 auto 24px;display:grid;place-items:center}.question{padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}.question h2{font-size:clamp(1.4rem,2.5vw,2.1rem);line-height:1.3;margin:15px 0}.question .prompt{margin:12px 0;color:var(--muted)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:26px}.answer{display:flex;gap:13px;align-items:center;text-align:left;min-height:98px;color:white;border:2px solid transparent;font-weight:600;background:#b33449}.answer:nth-child(4n+2){background:#215eb3}.answer:nth-child(4n+3){background:#997008}.answer:nth-child(4n+4){background:#27744b}.answer:disabled{opacity:1;cursor:default}.answer.selected{border-color:white;box-shadow:0 0 0 2px var(--purple)}.answer.correct{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime)}.answer .letter{font-size:1.25rem;font-weight:900;flex-shrink:0}.field{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-top:16px;padding:12px;background:#222238;border-radius:10px}.field select{margin:0}.cloze{font-size:1.12rem;line-height:2.7;margin:20px 0}.cloze select{display:inline-block;width:auto;max-width:100%;margin:0 4px}.controls{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.progress{height:5px;background:#303047;border-radius:5px;margin-top:24px;overflow:hidden}.progress span{display:block;height:100%;background:var(--lime)}.solution{background:#243824;border:1px solid #558c4c;border-radius:12px;padding:20px;margin-top:23px}.solution li{margin:5px 0}.score{font-size:2.5rem;color:var(--lime);font-weight:850}.rank{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.rank:first-child{background:#303923;border-radius:10px}.sessionbar{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px}.blank{padding:40px;text-align:center;color:var(--muted)}#connection{font-size:.8rem;color:var(--muted)}@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:static}.wrap{padding:0 20px 24px}.top{align-items:start}.sidebar .roomcode{font-size:2.6rem}}@media(max-width:600px){header{height:72px;margin-bottom:25px}.cards,.answers,.filters{grid-template-columns:1fr}.top{display:block}.top>.badge{margin-top:18px}.question{padding:20px}.field{grid-template-columns:1fr;gap:8px}.join{margin:32px auto}.roomcode{font-size:2.4rem}.wrap{padding:0 16px 24px}.controls button{flex:1}.brand{font-size:1.2rem}.badge{font-size:.75rem}.answer{min-height:80px}}
.roster{margin-top:20px;overflow-x:auto;text-align:left}.roster table{width:100%;border-collapse:collapse;font-size:.86rem}.roster caption{text-align:left;margin-bottom:10px}.roster th{color:var(--muted);font-size:.78rem;text-align:left;padding:8px 5px;border-bottom:1px solid var(--line)}.roster td{padding:12px 5px;border-bottom:1px solid var(--line);vertical-align:top}.roster th:last-child,.points{text-align:right;font-variant-numeric:tabular-nums}.place{font-weight:850;color:var(--lime)}.answer-state{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}.answer-state.done{color:var(--lime)}.host-controls{position:sticky;top:0;background:var(--panel);padding:12px 0;z-index:2;margin-top:12px}</style></head><body><div class="wrap"><header><div class="brand">Klassen<span>quiz</span><span style="color:var(--muted);font-size:.85rem;font-weight:450;margin-left:14px">AP1 Klassenquiz</span></div><div class="badge" id="role"></div></header><div id="error" class="notice" role="alert" hidden></div><main id="app"></main><div class="footer"><span id="connection">Bereit</span></div></div><script>
let BANK=[];
const DEFAULT_SERVICE="https://klassenquiz-ap1.thor-the-dwarf.chatgpt.site";
const EMBED_HOST=new URLSearchParams(location.search).get('leitung')==='1';
const IS_HOST=EMBED_HOST||BANK.length>0;
const storage={getItem(k){try{return localStorage.getItem(k)}catch{return null}},setItem(k,v){try{localStorage.setItem(k,v)}catch{}}};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={easy:'Leicht',normal:'Mittel',tough:'Anspruchsvoll'};
const localPreview=['localhost','127.0.0.1'].includes(location.hostname);
let service=DEFAULT_SERVICE;
let saved;try{saved=JSON.parse(storage.getItem(IS_HOST?'klassenquiz-host':'klassenquiz-player')||'null')}catch{}
let session=saved?.service===service?saved:null, view=null, selected=BANK.find(x=>x.title==='IT-Sicherheit'&&x.difficulty==='easy'&&x.variant===1)||BANK[0], topic='IT-Sicherheit',difficulty='', draft=[],busy=false,signature='',lastQuestion='',polling=false,actionError='';
function invitationCode(){const query=new URLSearchParams(location.search).get('raum'),hash=new URLSearchParams(location.hash.slice(1)).get('raum');const code=query||hash||'';return /^\d{6}$/.test(code)?code:''}
let roomCode=invitationCode(),joinName='';if(!IS_HOST&&roomCode&&session?.code!==roomCode)session=null;
$('#role').innerHTML=`<span class="dot"></span>${IS_HOST?'Spielleitung':'Teilnehmer'}`;
function notice(s){$('#error').textContent=s;$('#error').hidden=!s;const inline=$('#room-feedback');if(inline){inline.textContent=s;inline.hidden=!s}}
function saveSession(s){session=s;storage.setItem(IS_HOST?'klassenquiz-host':'klassenquiz-player',JSON.stringify(s));}
function fail(e){const message=e.name==='AbortError'?'Der Quizdienst antwortet gerade nicht. Bitte erneut versuchen.':e instanceof TypeError?'Die Verbindung zum Quizdienst ist fehlgeschlagen. Prüfe deine Internetverbindung und versuche es erneut.':e.message||'Verbindung fehlgeschlagen. Bitte erneut versuchen.';notice(message);$('#connection').textContent=session?'Verbindung unterbrochen · Verbindung wird erneut geprüft':'Raum konnte nicht geöffnet werden';}
async function api(action,data={},identity=session){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);let r;try{r=await fetch(service+'/api/quiz',{method:'POST',headers:{'Content-Type':'application/json',...(identity?{Authorization:'Bearer '+identity.token}:{})},body:JSON.stringify({action,code:identity?.code,...data}),signal:controller.signal});}finally{clearTimeout(timer)}let j;try{j=await r.json()}catch{throw Error('Der Quizdienst ist noch nicht erreichbar. Prüfe die Dienstadresse.')}if(!r.ok){const e=Error(j.error||'Die Anfrage konnte nicht verarbeitet werden.');e.status=r.status;throw e}return j;}
function link(){return "https://thor-the-dwarf.github.io/klassenquiz/teilnehmen.html?raum="+encodeURIComponent(session.code)}
function ranking(){const list=[...(view?.players||[])].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,'de'));let rank=0;return list.map((p,i)=>{if(i===0||p.score!==list[i-1].score)rank=i+1;return {...p,rank}})}
function people(){return view?.players?.length?`<div class="roster"><table><caption class="hint">Rangliste · ${view.players.length} Teilnehmer</caption><thead><tr><th>Rang</th><th>Name / Status</th><th>Punkte</th></tr></thead><tbody>${ranking().map(p=>`<tr><td class="place">${p.rank}</td><td><strong>${esc(p.name)}</strong><span class="answer-state ${p.answered?'done':''}">${view.phase==='lobby'?'Bereit':p.answered?'✓ Geantwortet':view.phase==='question'?'Noch offen':'Nicht geantwortet'}</span></td><td class="points">${Number(p.score).toLocaleString('de-DE')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint" style="margin-top:15px">Noch niemand dabei. Teile den Link mit deiner Klasse.</p>'}
function hostControls(){return `<div class="controls host-controls">${view.phase==='question'?'<button type="button" class="secondary" data-host-action="reveal">Antworten auflösen</button>':''}<button type="button" data-host-action="${view.index+1===view.total?'finish':'next'}">${view.index+1===view.total?'Ergebnis anzeigen':'Nächste Frage →'}</button><button type="button" class="outline" data-host-action="finish">Quiz beenden</button></div><p id="host-feedback" role="status" class="hint" style="margin-top:10px">${busy?'Aktion wird ausgeführt …':esc(actionError)||(view.phase==='question'?'„Nächste Frage“ beendet die Antwortphase und geht direkt weiter. Abgegebene Antworten zählen.':'Du kannst jetzt zur nächsten Frage weitergehen.')}</p>`}

function sidebar(){return `<aside class="sidebar panel"><div class="eyebrow">Dein Klassenraum</div>${session?`<div class="roomcode">${esc(session.code)}</div><label>Einladungslink<input class="linkfield" readonly value="${esc(link())}" onclick="this.select()"></label><div class="controls"><button class="secondary" onclick="copyLink()">Link kopieren</button><button class="outline" onclick="window.open(link(),'_blank')">Teilnehmeransicht ↗</button></div><hr class="divider"><h3>${view?.players?.length||0} Teilnehmer</h3>${people()}<hr class="divider"><p class="hint">Ausgewählt: ${esc(selected?.title)} · ${labels[selected?.difficulty]} · ${selected?.variant}</p><button class="large" style="margin-top:14px" onclick="startQuiz()">Klassenquiz starten →</button>`:`<h2>Die Klasse wartet auf dich.</h2><p class="muted" style="margin:15px 0 22px">Öffne einen Raum und lade deine Teilnehmer per Link und Code ein.</p><button id="create-room" class="large" onclick="createRoom()">Klassenraum öffnen →</button><p id="room-feedback" class="notice" style="margin-top:14px" role="status" hidden></p>`}<hr class="divider"><div class="hint">LFPV-AP1 · ${BANK.length} Übungen<br>Du bestimmst das Tempo. Jede vollständig richtige Aufgabe zählt 1.000 Punkte.</div><details><summary>Verbindung einstellen</summary><label>Dienstadresse<input id="service" value="${esc(service)}"></label><button class="secondary" style="margin-top:10px" onclick="setService()">Übernehmen</button></details></aside>`}
function renderHost(){const list=BANK.filter(x=>(!topic||x.title===topic)&&(!difficulty||x.difficulty===difficulty));$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">GFN / Prüfungsvorbereitung</div><h1>Deine Klasse. Dein Quiz.</h1><p class="muted">Wähle eine Übung. Gemeinsam lösen, besprechen und weiterkommen.</p></div><div class="badge">${BANK.reduce((n,x)=>n+x.tasks.length,0).toLocaleString('de-DE')} Aufgaben · 4 Themen</div></div><div class="layout"><section><div class="panel"><div class="sessionbar"><h3>Übung auswählen</h3><span class="hint">${list.length} Übungen</span></div><div class="filters"><label>Thema<select id="topic" onchange="topic=this.value;renderHost()"><option value="">Alle Themen</option>${[...new Set(BANK.map(x=>x.title))].map(t=>`<option ${t===topic?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>Schwierigkeit<select onchange="difficulty=this.value;renderHost()"><option value="">Alle Stufen</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${k===difficulty?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="cards">${list.map(x=>`<button class="exercise ${x.id===selected?.id?'selected':''}" onclick="selectExercise('${x.id}')"><span class="pill">${labels[x.difficulty]}</span><span class="arrow">${x.id===selected?.id?'✓':'↗'}</span><h3>${esc(x.title)}</h3><span class="meta">Variante ${x.variant} · ${x.tasks.length} Aufgaben</span></button>`).join('')}</div></div><div class="panel" style="margin-top:18px"><div class="sessionbar"><div><div class="hint">Ausgewählt</div><h3>${esc(selected?.title)} · ${labels[selected?.difficulty]} · ${selected?.variant}</h3></div></div><button class="large" onclick="startQuiz()" ${!session?'disabled':''}>Klassenquiz starten →</button>${!session?'<p class="hint" style="margin-top:10px">Öffne zuerst deinen Klassenraum.</p>':''}</div></section>${sidebar()}</div>`;}
function selectExercise(id){selected=BANK.find(x=>x.id===id);renderHost()}
function renderJoin(){ $('#app').innerHTML=`<section class="join panel"><div class="eyebrow">Gemeinsam lernen</div><h1>Bist du dabei?</h1><form onsubmit="event.preventDefault();joinRoom()"><label>Raumcode<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" value="${esc(roomCode)}" required></label><label>Dein Anzeigename<input id="name" maxlength="24" autocomplete="nickname" placeholder="Wie heißt du?" value="${esc(joinName)}" required></label><button id="join-room" class="large" type="submit">Mitspielen →</button></form><p class="hint" style="margin-top:20px">Den Raumcode erhältst du von deiner Kursleitung. Ein Konto brauchst du nicht.</p></section>`}
function renderWait(){ $('#app').innerHTML=`<section class="join panel waiting"><div class="symbol">✓</div><div class="eyebrow">Raum ${esc(session.code)}</div><h1>Du bist dabei,<br>${esc(view.me.name)}.</h1><p class="muted" style="margin-top:22px">Sobald die Kursleitung startet, erscheint hier deine Aufgabe.</p><div class="badge" style="margin-top:24px">${view.players.length} Teilnehmer bereit</div>${people()}</section>`}
function options(q,val){return '<option value="">Bitte auswählen …</option>'+q.choices.map(o=>`<option value="${esc(o.id)}" ${o.id===val?'selected':''}>${esc(o.label)}</option>`).join('')}
function answerUi(q,locked){if(q.kind==='choice')return `<div class="answers">${q.choices.map((o,i)=>`<button class="answer ${draft.includes(o.id)?'selected':''} ${q.solution?.includes(o.id)?'correct':''}" ${locked?'disabled':''} onclick="choose('${o.id}')"><span class="letter">${'ABCD'[i]||i+1}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`;
if(q.kind==='cloze'){let n=0;return '<div class="cloze">'+q.parts.map(p=>p===null?`<select aria-label="Lücke ${n+1}" ${locked?'disabled':''} onchange="draft[${n}]=this.value;updateSubmit()">${options(q,draft[n++])}</select>`:esc(p)).join('')+'</div>'}
return q.fields.map((f,i)=>`<div class="field"><label for="answer-${i}">${esc(f)}</label><select id="answer-${i}" ${locked?'disabled':''} onchange="draft[${i}]=this.value;updateSubmit()">${options(q,draft[i])}</select></div>`).join('');}
function solutionUi(q){if(!q.solution)return '';const names=q.solution.map(s=>q.choices.find(x=>x.id===s)?.label||s);return `<div class="solution"><h3>Die Auflösung</h3><ol>${names.map((s,i)=>`<li>${q.kind==='match'?esc(q.fields[i])+': ':''}${esc(s)}</li>`).join('')}</ol><p>${esc(q.explanation)}</p></div>`}
function renderQuestion(){const q=view.question,host=IS_HOST,reveal=view.phase==='reveal',locked=host||reveal||!!view.me?.answered;$('#app').innerHTML=`<div class="sessionbar"><div><div class="eyebrow">${esc(view.title)}</div><span class="muted">Aufgabe ${view.index+1} / ${view.total} · ${esc(q.tag)}</span></div><div class="badge">Raum ${esc(session.code)}</div></div><div class="layout"><section class="question"><div class="badge">${reveal?'Gemeinsam besprechen':host?'Antworten werden gesammelt':'Du bist dran'}</div>${host?hostControls():''}<h2>${esc(q.title)}</h2>${q.prompt?`<p class="prompt">${esc(q.prompt)}</p>`:''}${q.multi?'<p class="hint">Mehrere Antworten sind richtig.</p>':''}${answerUi(q,locked)}${solutionUi(q)}${host?'':`<div class="controls">${reveal?`<span class="badge">${view.me.answered?(view.me.lastScore+' / 1.000 Punkte'):'Keine Antwort abgegeben'}</span><p class="hint">Die Kursleitung startet die nächste Aufgabe.</p>`:view.me.answered?'<span class="badge">✓ Antwort abgegeben</span><p class="hint">Warte auf die gemeinsame Auflösung.</p>':'<button id="submit" onclick="submitAnswer()">Antwort abgeben</button>'}</div>`}<div class="progress"><span style="width:${100*(view.index+1)/view.total}%"></span></div></section><aside class="panel sidebar"><div class="eyebrow">Die ganze Klasse</div><div class="score">${view.players.filter(p=>p.answered).length} / ${view.players.length}</div><p class="muted">Antworten abgegeben</p>${people()}<hr class="divider"><p class="hint">${reveal?'Punktestand nach dieser Aufgabe.':'Punktestand der abgeschlossenen Aufgaben. Die aktuelle Aufgabe zählt nach der Auflösung oder beim Weitergehen.'}</p></aside></div>`;updateSubmit();}

function updateSubmit(){const b=$('#submit');if(!b||!view?.question)return;const q=view.question;b.disabled=q.kind==='choice'?!draft.length:(draft.filter(Boolean).length!==q.fields.length||(q.kind==='order'&&new Set(draft).size!==draft.length));}
function choose(id){if(view.question.multi)draft=draft.includes(id)?draft.filter(x=>x!==id):[...draft,id];else draft=[id];renderQuestion()}
function renderResult(){$('#app').innerHTML=`<div class="top"><div><div class="eyebrow">${esc(view.title)}</div><h1>Gemeinsam geschafft.</h1><p class="muted">${view.total} Aufgaben in dieser Übung · Punkte ohne Zeitdruck</p></div></div><section class="panel" style="max-width:800px;margin:auto"><h2 style="margin-bottom:22px">Euer Ergebnis</h2>${people()}${IS_HOST?'<div class="controls"><button data-host-action="lobby">Nächste Übung auswählen →</button></div>':'<p class="hint" style="margin-top:24px">Bleib dabei. Die nächste Übung startet im selben Raum.</p>'}</section>`}

function render(){if(!session){IS_HOST?renderHost():renderJoin();return}if(!view){$('#app').innerHTML='<div class="blank">Klassenraum wird geladen …</div>';return}if(view.phase==='lobby'){IS_HOST?renderHost():renderWait()}else if(view.phase==='finished')renderResult();else renderQuestion();}
async function transact(fn){if(busy)return;busy=true;actionError='';notice('');try{await fn()}catch(e){actionError=e.message||'Aktion fehlgeschlagen';fail(e);const status=$('#host-feedback');if(status)status.textContent=actionError}finally{busy=false}}
async function createRoom(){if(busy)return;const button=$('#create-room');if(button){button.disabled=true;button.textContent='Klassenraum wird geöffnet …'}$('#connection').textContent='Verbindung zum Quizdienst wird hergestellt …';await transact(async()=>{const j=await api('create');saveSession({...j,service});await refresh(true)});if(button?.isConnected){button.disabled=false;button.textContent='Erneut versuchen →'}}
async function joinRoom(){if(busy)return;const code=$('#code').value.trim(),name=$('#name').value.trim();roomCode=code;joinName=name;const button=$('#join-room');if(button){button.disabled=true;button.textContent='Du trittst dem Raum bei …'}await transact(async()=>{const j=await api('join',{code,name},null);saveSession({...j,code,service});view=null;signature='';try{history.replaceState(null,'',location.pathname+'?raum='+encodeURIComponent(code))}catch{}render();await refresh(true)});if(button?.isConnected){button.disabled=false;button.textContent='Mitspielen →'}}

async function startQuiz(){await transact(async()=>{await api('start',{exercise:selected});await refresh(true)})}
async function sendHostAction(action){if(!IS_HOST||!view||busy)return;if(!['reveal','next','finish','lobby'].includes(action))return;const status=$('#host-feedback');if(status)status.textContent='Aktion wird ausgeführt …';document.querySelectorAll('[data-host-action]').forEach(button=>button.disabled=true);await transact(async()=>{await api(action,{version:view.version});await refresh(true)});document.querySelectorAll('[data-host-action]').forEach(button=>button.disabled=false);const feedback=$('#host-feedback');if(feedback)feedback.textContent=actionError||(view?.phase==='reveal'?'Aufgelöst. Du kannst jetzt zur nächsten Frage weitergehen.':'Bereit. Du steuerst die nächste Aktion.')}
document.addEventListener('click',async event=>{const button=event.target?.closest?.('[data-host-action]');if(!button||button.disabled)return;await sendHostAction(button.dataset.hostAction)});
async function submitAnswer(){await transact(async()=>{await api('answer',{answer:draft,index:view.index,round:view.round});await refresh(true)})}
async function copyLink(){try{await navigator.clipboard.writeText(link());$('#connection').textContent='Einladungslink kopiert'}catch{notice('Bitte den Einladungslink im Feld markieren und kopieren.')}}
function setService(){try{const u=new URL($('#service').value);if(!['https:','http:'].includes(u.protocol))throw Error();service=u.origin;storage.setItem('klassenquiz-service',service);saveSession(null);view=null;signature='';render()}catch{notice('Bitte eine gültige Dienstadresse eingeben.')}}
async function refresh(force=false){if(!session||polling===session.token)return;const active=session;polling=active.token;try{const j=await api('state',{},active);if(session?.token!==active.token||session?.code!==active.code)return;if(view&&j.version<view.version)return;const key=j.round+':'+j.index;if(key!==lastQuestion){draft=[];lastQuestion=key}view=j;if(j.me?.answer)draft=j.me.answer;const sig=JSON.stringify(j);if(force||sig!==signature){signature=sig;render()}$('#connection').textContent='● Verbunden · Raum '+active.code;if(!actionError)notice('')}catch(e){if(session?.token!==active.token||session?.code!==active.code)return;if(e.status===401||e.status===404||e.status===410){roomCode=active.code;saveSession(null);view=null;render()}fail(e)}finally{if(polling===active.token)polling=false}}
window.addEventListener('hashchange',()=>{if(IS_HOST)return;const code=invitationCode();if(!code||code===roomCode)return;roomCode=code;joinName='';if(session?.code!==code){saveSession(null);view=null;signature=''}render()});

function boot(){render();if(session)refresh(true);}
if(EMBED_HOST){
 $('#app').innerHTML='<section class="join panel"><h1>Kurs wird geladen …</h1><p class="muted" style="margin-top:20px">Öffne die Klassenquiz.html aus deinem Kursordner, um die Spielleitung zu starten.</p></section>';
 window.addEventListener('message',event=>{
  if(window.parent===window||event.source!==window.parent||event.data?.type!=='klassenquiz:course')return;
  const courses=event.data.bank;if(!Array.isArray(courses)||!courses.length||courses.length>100||!courses.every(e=>typeof e.id==='string'&&typeof e.title==='string'&&Array.isArray(e.tasks)))return;
  BANK=courses;selected=BANK.find(x=>x.title==='IT-Sicherheit'&&x.difficulty==='easy'&&x.variant===1)||BANK[0];topic=selected.title;boot();window.parent.postMessage({type:'klassenquiz:loaded'},'*');
 });
 if(window.parent!==window)window.parent.postMessage({type:'klassenquiz:ready'},'*');
}else boot();
setInterval(()=>{if(!EMBED_HOST||BANK.length)refresh()},1500);
if(document.modelContext?.registerTool){
 const life=new AbortController();window.addEventListener('pagehide',()=>life.abort(),{once:true});
 const register=t=>{try{Promise.resolve(document.modelContext.registerTool(t,{signal:life.signal})).catch(()=>{})}catch{}};
 register({name:'quiz_status',description:'Liest den sichtbaren Klassenquiz-Status ohne Zugangsschlüssel.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({role:IS_HOST?'host':'participant',room:session?.code||null,phase:view?.phase||null,exercise:selected?.id||null,participants:view?.players.length||0})});
 if(IS_HOST)register({name:'select_exercise',description:'Wählt eine vorhandene Übung in der sichtbaren Lobby aus; startet sie noch nicht.',inputSchema:{type:'object',properties:{exerciseId:{type:'string'}},required:['exerciseId'],additionalProperties:false},annotations:{readOnlyHint:false},execute:({exerciseId})=>{if(!BANK.some(x=>x.id===exerciseId))throw Error('Unbekannte Übung');if(view&&view.phase!=='lobby')throw Error('Nur in der Übungsauswahl verfügbar');selectExercise(exerciseId);return {selected:selected.id,title:selected.title};}});
}
</script></body></html>
